# The summary names each test slower than 10 s, with its time, and every test's time is kept in
# target/nextest/default/junit.xml.
[profile.default]
status-level = "fail"
fail-fast = false
final-status-level = "slow"
slow-timeout = { period = "10s", terminate-after = 12 }

[profile.default.junit]
path = "junit.xml"
