[package]
name = "fake-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A fake Claude Code, or Codex, for the apps' tests: it runs in a Herdr pane, runs their hooks and reports what it does."

[dependencies]
rustix = { version = "1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
