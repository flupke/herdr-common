[package]
name = "vision-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The vision MCP core: an agent's eyes and hands on an app in the app sandbox (screen, screenshot, key, type, click, drag, settle, wait_for), which an app's own MCP server takes in with its own tools."

[[bin]]
# The probe, the small program the integration tests drive: it speaks vision-signal.
name = "vision-probe"
path = "src/bin/vision-probe.rs"
test = false

[dependencies]
app-sandbox = { path = "../app-sandbox" }
base64 = "0.22"
eyre = "0.6"
rmcp = { version = "3.3", default-features = false, features = ["server", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["rt"] }
vision-display = { path = "../vision-display" }
vision-signal = { path = "../vision-signal" }

[dev-dependencies]
png = "0.18"
rmcp = { version = "3.3", default-features = false, features = ["client", "server", "macros"] }
tokio = { version = "1.52", features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
